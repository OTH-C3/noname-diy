function bad(name, detail) { fail++; log("  [失败] " + name + (detail ? "  — " + detail : "")); }
function check(name, cond, detail) { cond ? ok(name, detail) : bad(name, detail || ""); }
function section(t) { log("\n== " + t + " =="); }

function q(sel) { return d.querySelector(sel); }
function qa(sel) { return Array.prototype.slice.call(d.querySelectorAll(sel)); }
function id(x) { return d.getElementById(x); }
function fire(el, type) {
	el.dispatchEvent(new w.Event(type, { bubbles: true, cancelable: true }));
}
function setVal(el, v) { el.value = v; fire(el, "input"); fire(el, "change"); }
function click(el) { el.click(); }
function tick(ms) { return new Promise(function (r) { setTimeout(r, ms || 0); }); }
/* 等一个条件成立 —— 最多 tries*step 毫秒。图片解码、FileReader 都是异步的，
 * 机器忙时固定 tick 会等不够（实测过：立绘在服务端刚重启那轮没赶上）。 */
async function waitFor(cond, tries, step) {
	tries = tries || 40; step = step || 100;
	for (var i = 0; i < tries; i++) {
		if (cond()) return true;
		await tick(step);
	}
	return cond();
}
function status() { var e = id("form-status"); return e ? e.textContent.replace(/\s+/g, " ").trim() : ""; }

/* 造一个真实可解码的 PNG File（canvas → blob） */
async function makeImageFile(name, ww, hh) {
	var cv = document.createElement("canvas");
	cv.width = ww; cv.height = hh;
	var ctx = cv.getContext("2d");
	ctx.fillStyle = "#3a6ea5"; ctx.fillRect(0, 0, ww, hh);
	ctx.fillStyle = "#ffd166"; ctx.fillRect(ww * 0.25, hh * 0.25, ww * 0.5, hh * 0.5);
	var blob = await new Promise(function (r) { cv.toBlob(r, "image/png"); });
	return new w.File([blob], name, { type: "image/png" });
}

/* 造一个「声音」文件：只验流程，不要求真能解码 */
function makeAudioFile(name, bytes, type) {
	var u8 = new Uint8Array(bytes || 64);
	for (var i = 0; i < u8.length; i++) u8[i] = (i * 37) % 251;
	return new w.File([u8], name, { type: type || "audio/mpeg" });
}

function setFiles(input, files) {
	var dt = new w.DataTransfer();
	files.forEach(function (f) { dt.items.add(f); });
	input.files = dt.files;
	fire(input, "change");
}

/* ── 拦截 iframe 里的 fetch，用来断言「客户端到底发了什么」 ───────────── */
var sent = [];
var origFetch = null;
function installFetchSpy() {
	if (!origFetch) origFetch = w.fetch;
	sent = [];
	w.fetch = function (url, init) {
		sent.push({ url: String(url), body: init && init.body ? String(init.body) : "" });
		return Promise.resolve({
			ok: true, status: 200,
			json: function () { return Promise.resolve({ ok: true, path: "/tmp/fake/latest-request.json" }); },
		});
	};
}
function restoreFetch() {
	if (origFetch) w.fetch = origFetch;
}
function lastJson() {
	for (var i = sent.length - 1; i >= 0; i--) {
		try { return { url: sent[i].url, data: JSON.parse(sent[i].body) }; } catch (e) { /* 非 JSON */ }
	}
	return null;
}
function sentTo(pattern) {
	return sent.filter(function (s) { return s.url.indexOf(pattern) >= 0; });
}

function audioInputOf(idx) {
	var blk = moreBlocks()[idx];
	return blk ? blk.querySelector('.skill-audio input[type="file"]') : null;

function flagBoxesOf(idx) {
	var blk = moreBlocks()[idx];
	return blk ? Array.prototype.slice.call(blk.querySelectorAll(".skill-flags input")) : [];

function checkedFlags(idx) {
	return flagBoxesOf(idx).filter(function (b) { return b.checked; }).map(function (b) { return b.value; });

	var r = d.querySelector('input[name="' + name + '"][value="' + value + '"]');
	if (r) { r.checked = true; fire(r, "change"); }
	return r;
}

T("7.3 导出头像产出 350×464 的图", async function () {
	/* 导出走 canvas.toBlob（异步）→ URL.createObjectURL → a.click()。
	 * 拦 createObjectURL 拿 blob 最稳，拦 a.click 会太早。 */
	var blobs = [];
	var origCreate = w.URL.createObjectURL;
	w.URL.createObjectURL = function (b) { blobs.push(b); return origCreate.call(w.URL, b); };
	var origClick = w.HTMLAnchorElement.prototype.click;
	w.HTMLAnchorElement.prototype.click = function () {};
	click(id("cropper-export"));
	await tick(1200);            /* toBlob 是异步的，等足 */
	w.URL.createObjectURL = origCreate;
	w.HTMLAnchorElement.prototype.click = origClick;
	check("导出产出了图片 blob", blobs.length === 1, "实为 " + blobs.length + " 个");
	check("导出提示正确", /已导出/.test(status()), status());
	if (!blobs.length) return;
	var bmp = await new Promise(function (r) {
		w.createImageBitmap(blobs[0]).then(function (b) { r(b); },
			function () { r(null); });
	});
	check("导出尺寸 350×464", !!bmp && bmp.width === 350 && bmp.height === 464,
		bmp ? bmp.width + "x" + bmp.height : "解码失败");
	check("导出的是 jpeg", blobs[0].type === "image/jpeg", blobs[0].type);
});

/** 造一个「文件夹选择」出来的 File：带 webkitRelativePath */
function makeFixtureFiles(top) {
	return Object.keys(FIXTURE).map(function (rel) {
		var f = new w.File([FIXTURE[rel]], rel.split("/").pop(),
			{ type: /\.json$/.test(rel) ? "application/json" : "text/javascript" });
		try { Object.defineProperty(f, "webkitRelativePath", { value: top + "/" + rel }); } catch (e) {}
		return f;
	});
}
function b64ToFile(b64, name, type) {
	var bin = atob(b64);
	var u8 = new Uint8Array(bin.length);
	for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
	return new w.File([u8], name, { type: type });
}

T("13.3 卡面识别：取回的结果只填空白项，不覆盖已填内容", async function () {
	await resetAll();
	await tick(60);
	click(id("ci-toggle"));
	await waitFor(function () { return id("card-import").hidden === false; }, 20, 50);

	/* 先手填一个名字 —— 识别结果**不该**把它覆盖掉（ciApply 只填空白） */
	setVal(id("f-name"), "我自己起的名字");
	setFiles(id("ci-card"), [await makeImageFile("card.jpg", 700, 1000)]);
	await waitFor(function () { return id("ci-start").disabled === false; }, 30, 100);

	/* 局部替换 fetch：只管这两个接口，跑完立刻还原，别污染别的用例 */
	var orig = w.fetch;
	var hits = [];
	w.fetch = function (url) {
		var u = String(url);
		var reply = function (obj) {
			return Promise.resolve({
				ok: true,
				status: 200,
				json: function () { return Promise.resolve(obj); },
			});
		};
		if (u.indexOf("/api/card-source") >= 0) { hits.push("source"); return reply({ ok: true, dir: "/tmp/fake/card" }); }
		if (u.indexOf("/api/card-import") >= 0) {
			hits.push("import");
			/* 名字故意给一个不同的值，用来验证"不覆盖" */
			return reply({ name: "识别出来的名字", title: "识别称号" });
		}
		return reply({ ok: true });
	};

	try {
		click(id("ci-start"));
		await waitFor(function () { return hits.indexOf("source") >= 0; }, 60, 100);
		check("点「识别卡面」会先请求 /api/card-source", hits.indexOf("source") >= 0, "hits=" + hits.join(","));

		/* 页面每 3 秒轮询一次，给足时间 */
		await waitFor(function () { return hits.indexOf("import") >= 0; }, 80, 100);
		check("随后开始轮询 /api/card-import", hits.indexOf("import") >= 0, "hits=" + hits.join(","));

		await waitFor(function () { return id("f-title").value !== ""; }, 40, 100);
		check("空白项被回填（称号）", id("f-title").value === "识别称号", id("f-title").value);
		check("已填的武将名没被覆盖", id("f-name").value === "我自己起的名字", id("f-name").value);
	} finally {
		w.fetch = orig;
	}
});

	await waitFor(function () { return !id("official-picker").hidden; }, 20, 50);
	var packSel = id("official-pack");
	await waitFor(function () { return packSel.options.length > 1; }, 80, 100);
	if (packSel.options.length <= 1) {
		ok("工作区里没有官方包可读，跳过本条");
		return;
	}
	packSel.value = packSel.options[1].value;
	fire(packSel, "change");
	var charSel = id("official-char");
	await waitFor(function () { return charSel.options.length > 1; }, 120, 100);
	charSel.value = charSel.options[1].value;
	fire(charSel, "change");
	await tick(250);

	var nameBefore = id("f-name").value;
	var charBefore = charSel.value;

	pickRadio("extMode", "new");
	await tick(150);
	pickRadio("extMode", "existing");
	await tick(200);

	check("切回后官方包面板仍开着", id("official-picker").hidden === false,
		"hidden=" + id("official-picker").hidden);
	check("切回后仍是「扩展名」模式", id("f-new-ext").hidden === false,
		"f-new-ext hidden=" + id("f-new-ext").hidden);
	check("切回后包与武将的选择还在",
		id("official-char").value === charBefore && id("f-name").value === nameBefore,
		id("official-char").value + " / " + id("f-name").value);
	check("切回后选择框仍显示包名", /假官方包/.test(id("f-ext-existing").textContent),
		id("f-ext-existing").textContent.replace(/\s+/g, " ").slice(0, 40));
});

T("14.6 点过官方包后切新建：填的名字要生效，且不带模板标记", async function () {
	await resetAll();
	pickRadio("extMode", "existing");

	var packSel = id("official-pack");

		ok("工作区里没有官方包可读，跳过本条");

});

T("14.7 改选扩展后，旧武将选择不残留（不带 editTarget）", async function () {
	await resetAll();

/* ── 15. 从工作区选择已有扩展（不用找 zip）────────────────────────────── */

T("15.1 「工作区里已有的扩展」入口与选择区（结构）", async function () {
	await resetAll();
	pickRadio("extMode", "existing");
	await tick(60);
	check("菜单里有「工作区里已有的扩展」入口", !!id("edit-pick-workspace"));
	var wrap = id("workspace-picker");
	check("选择区默认隐藏", !!wrap && wrap.hidden === true, wrap ? "hidden=" + wrap.hidden : "缺元素");
	check("扩展下拉 / 武将下拉都在", !!id("workspace-ext") && !!id("workspace-char"));
});

T("15.2 点入口能列出工作区扩展，选中后扩展名就位", async function () {
	await resetAll();
	pickRadio("extMode", "existing");
	await tick(60);
	click(id("edit-pick-workspace"));
	await waitFor(function () { return !id("workspace-picker").hidden; }, 20, 50);
	check("选择区已展开", id("workspace-picker").hidden === false);

	var extSel = id("workspace-ext");
	await waitFor(function () { return extSel.options.length > 1; }, 60, 100);
	if (extSel.options.length <= 1) {
		ok("工作区里没有扩展，跳过本条（空态：" + extSel.options[0].textContent.trim() + "）");
		return;
	}
	check("扩展下拉被填充", true, extSel.options.length + " 项：" +
		Array.prototype.slice.call(extSel.options, 1).map(function (o) { return o.textContent; }).join("、"));

	/* 只选**工作区里**的：选游戏包那份会触发"复制到工作区"，
	 * 测试不该顺手往工作区里拷东西。没有就跳过选中步骤。 */
	var wsOnly = Array.prototype.slice.call(extSel.options, 1).filter(function (o) {
		return o.textContent.indexOf("（游戏包里") < 0;
	});
	if (!wsOnly.length) {
		ok("下拉里只有游戏包里的扩展（选中会触发复制），跳过选中步骤");
		return;
	}

	extSel.value = extSel.options[1].value;
	fire(extSel, "change");
	var charSel = id("workspace-char");
	await waitFor(function () {
		return charSel.options.length > 1 || /失败/.test(charSel.options[0].textContent);
	}, 60, 100);
	var charNames = Array.prototype.slice.call(charSel.options, 1).map(function (o) { return o.textContent.trim(); });
	check("武将下拉被铺开（列出武将 / 明确报错 / 明确说 0 个）",
		charNames.length > 0 || /失败/.test(charSel.options[0].textContent) || /0 个武将/.test(status()),
		charNames.length ? charNames.join("、") : charSel.options[0].textContent.trim());
	check("扩展名写进了表单（提交时 AI 才知道改哪个包）",
		id("f-ext").value.length > 0, "f-ext=" + id("f-ext").value);
});

/* ── 运行 ─────────────────────────────────────────────────────────────── */
fr.addEventListener("load", async function () {
	d = fr.contentDocument;
	w = fr.contentWindow;
	Array.prototype.forEach.call(d.querySelectorAll(".reveal"), function (el) {
		el.classList.add("is-in");
	});
	var st = d.createElement("style");
	st.textContent = "*{animation:none!important;transition:none!important}";
	d.head.appendChild(st);
	await tick(300);

	/* 真实提交那两条用例会写 <工作区>/.diy-workshop/latest-request.json。
	 * 如果工作区里本来就有别人的提交（拿正式工作区跑测试），那就是覆盖人家 ——
	 * 2026-10-15 真踩过（用户刚提交的表单被测试的「端到端」用例冲掉）。
	 * 所以开跑前先问一次服务：已经有提交就跳过那两条。 */
	try {
		var h = await w.fetch("/api/health", { cache: "no-store" }).then(function (r) { return r.json(); });
		hasSubmitAtStart = !!h && !!h.hasSubmit;
	} catch (e) {
		hasSubmitAtStart = false;
	}
	log("（工作区里已有提交：" + (hasSubmitAtStart ? "是 → 跳过真实提交用例" : "否") + "）");

	for (var i = 0; i < cases.length; i++) {
		var c = cases[i];
		section(c.name);
		try {
			await c.fn();
		} catch (e) {
			bad(c.name + "（抛异常）", e && e.message ? e.message : String(e));
			if (e && e.stack) log("      " + String(e.stack).split("\n").slice(0, 3).join("\n      "));
		}
		log("      · 状态行：" + (status() || "（空）"));
		restoreFetch();
	}
	log("\n=== 合计：通过 " + pass + " 项，失败 " + fail + " 项 ===");
});
